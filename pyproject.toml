[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trainweave"
version = "0.2.0"
description = "End-to-end LoRA/DPO fine-tuning, artifact manifest emission, and Night-Shift dataset validation"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
aws = [
    "boto3>=1.34.0",
]
passport = [
    "gatewayweave>=0.1.0",
]
pii = [
    "veilweave>=0.1.0",
]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.4.0",
]

[project.scripts]
trainweave-flywheel = "training.flywheel_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
